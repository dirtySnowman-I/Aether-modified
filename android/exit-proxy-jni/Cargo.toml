[package]
name = "aether-final-proxy-android"
version = "0.9.2"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "aether_final_proxy"
crate-type = ["cdylib"]

[dependencies]
aether-exit-proxy = { path = "../../src-tauri/exit-proxy" }
jni = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

