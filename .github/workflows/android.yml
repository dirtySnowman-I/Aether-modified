name: Android final proxy
on:
  push:
    branches: [android]
    paths: ['android/**', 'src-tauri/exit-proxy/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: '28.2.13676358'
      RUSTFLAGS: '-C link-arg=-Wl,-z,max-page-size=16384'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Check out the exact Android source identified in base.apk
        uses: actions/checkout@v4
        with:
          repository: QW-AI-Code/Aether
          ref: c02509ebe2df6cf602cb60a59be18a8fb3d49509
          path: android/upstream
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install native toolchain
        run: |
          sdkmanager "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri/exit-proxy
            android/exit-proxy-jni
            android/upstream/.native/aether/aether -> ../target
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test the v0.9.2 relay and Android binding
        run: |
          cargo test --manifest-path src-tauri/exit-proxy/Cargo.toml --locked
          cargo test --manifest-path android/exit-proxy-jni/Cargo.toml
          cargo build --manifest-path android/exit-proxy-jni/Cargo.toml
          javac -d android/jni-smoke-classes android/tests/FinalProxy.java
          java -Djava.library.path=android/exit-proxy-jni/target/debug -cp android/jni-smoke-classes studio.cluvex.aether.core.FinalProxy
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Fetch pinned native sources
        working-directory: android/upstream
        env:
          AETHER_FORCE_CLONE: '1'
          AETHER_REF: v1.5.0
          HEV_REF: '2.18.0'
        run: |
          bash scripts/fetch-natives.sh
          test "$(git -C .native/aether rev-parse HEAD)" = 66a798b7771d5ffbb28fc858bffc99fb67295baf
          test "$(git -C .native/hev-socks5-tunnel rev-parse HEAD)" = d9dca26c7ad0e494492244f0309e80ee583e739e
      - name: Apply modified client
        run: |
          rsync -a android/overlay/ android/upstream/
          python3 android/prepare-build.py android/upstream
          printf '1.5.0\n' > android/upstream/native/aether/CORE_VERSION
      - name: Build native phone VPN bridge and Aether core
        working-directory: android/upstream
        run: bash scripts/build-natives.sh all
      - name: Build the v0.9.2 final-proxy library for both phone CPUs
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a --platform 26 -o android/upstream/app/src/main/jniLibs build --manifest-path android/exit-proxy-jni/Cargo.toml --release
      - name: Build installable preview APKs
        working-directory: android/upstream
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Check APK contents and signatures
        run: |
          python3 android/verify-apk.py android/upstream/app/build/outputs/apk/debug
          mkdir -p android/artifacts
          for apk in android/upstream/app/build/outputs/apk/debug/*.apk; do
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify "$apk"
            filename="$(basename "$apk")"
            cp "$apk" "android/artifacts/Aether-Modified-0.9.2-android.1-${filename#app-}"
          done
          cd android/artifacts
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Aether-Modified-Android-0.9.2
          path: android/artifacts/*
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-validation
          path: |
            android/upstream/app/build/reports/lint-results-debug.html
            android/upstream/app/build/reports/lint-results-debug.xml
